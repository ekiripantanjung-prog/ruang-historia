# Memproses foto/ilustrasi yang diunggah guru ke folder gambar/guru/.
# Berjalan otomatis setiap ada file baru, diubah, atau dihapus di folder itu.
name: Gambar guru
on:
  workflow_dispatch:
  push:
    paths:
      - 'gambar/guru/**'
      - 'alat/gambar_guru.py'
permissions:
  contents: write
jobs:
  guru:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Proses gambar guru
        run: python alat/gambar_guru.py
      - name: Simpan ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add gambar/guru.json gambar/guru-tampil
          git commit -m "Perbarui gambar guru" || echo "tidak ada perubahan"
          git pull --rebase -q origin main
          git push
